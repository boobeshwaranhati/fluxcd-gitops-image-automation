name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "!app/base/deployment.yaml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/boobesh2005/fluxcd-gitops-image-automation
          tags: |
            type=sha,format=short,prefix=

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app/base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update deployment image
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          sed -i -E \
            "s|(image: docker.io/boobesh2005/fluxcd-gitops-image-automation:)[a-f0-9]{7}|\1${IMAGE_TAG}|" \
            app/base/deployment.yaml

      - name: Commit deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/base/deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update deployment image to ${{ steps.meta.outputs.version }}"
            git push
          fi
